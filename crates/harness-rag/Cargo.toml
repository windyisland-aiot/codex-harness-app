[package]
name = "harness-rag"
version = "0.1.0"
edition = "2021"
description = "T18 知识库 RAG：ChromaDB HTTP 客户端 + mcp_servers.rag 一键配置生成 + stdio MCP server 二进制"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
