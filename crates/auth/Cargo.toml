[package]
name = "harness-auth"
description = "App-level account/password auth for the internal Agent desktop app (login, logout, session token, throttling). Decoupled from model/Feishu credentials."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"