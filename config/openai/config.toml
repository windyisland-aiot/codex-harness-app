# Harness 客户端的默认 CODEX_HOME 配置（v0.7.0）。
#
# 架构：codex 跑在**本地**，只有「模型推理」这一步走服务端代理。
#
#   codex app-server (wire_api = responses)
#       ↓ POST {base_url}/responses     Bearer = 登录 token
#   bibike 服务端 /api/v1/llm 代理       ← 管理员在后台配置真实上游
#       ↓ Bearer = 服务端持有的 api_key
#   真实模型上游（火山方舟 / 任意 OpenAI 兼容网关）
#
# 要点：
# - 客户端**不含任何模型密钥**。`env_key` 指向的环境变量由 appserver_start 注入，
#   值是登录 token，服务端据此校验登录态（登录即可用，不做用量计量）。
# - `base_url` 由 appserver_start 在启动时按登录态回写，这里的值只是兜底。
# - 文件读写、命令执行、MCP（飞书 / 影刀）全部在本地，不受服务端影响；
#   因此 wire_api 必须是 responses —— tool_calls 需无损透传。

model = "deepseek-v4-flash"
model_provider = "volcengine-ark"
approval_policy = "never"

[model_providers.volcengine-ark]
name = "bibike 服务端模型代理"
base_url = "http://118.31.107.214/api/v1/llm"
env_key = "VOLCENGINE_ARK_API_KEY"
wire_api = "responses"
