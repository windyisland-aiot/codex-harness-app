# T07 单模型打通（OpenAI）：企业内 Agent 桌面应用的默认配置。
#
# - 该 CODEX_HOME 目录（config/openai）作为 app 的默认 Codex 配置根，
#   由 harness 在启动 `codex app-server` 时通过 CODEX_HOME 指向。
# - 单模型：model_provider = "openai"，model 显式指定（不设则用 codex 默认）。
# - 鉴权：OPENAI_API_KEY 由 harness 注入 codex 子进程环境变量（不走 config，
#   减少泄露面）；有 env 时 codex 走 ApiKey 模式，无需 ChatGPT 登录界面。
# - approval_policy = "never" 仅为自动测试默认；生产可通过 T08/T09 面板调整。

model = "gpt-5.2-codex"
model_provider = "openai"
approval_policy = "never"

# `openai` 是内置 provider（不可覆盖，base_url 固定为 https://api.openai.com/v1）。
# 若企业需自定义端点/密钥名，可新增自定义 provider 并在 `[model]` 指向：
#
# [model_providers.enterprise-gw]
# name = "enterprise-gateway"
# base_url = "http://model-gw.example.com/v1"
# env_key = "HARNESS_MODEL_KEY"
# wire_api = "responses"