# T07 单模型打通（OpenAI）：企业内 Agent 桌面应用的默认配置。
#
# - 该 CODEX_HOME 目录（config/openai）作为 app 的默认 Codex 配置根，
#   由 harness 在启动 `codex app-server` 时通过 CODEX_HOME 指向。
# - 单模型：model_provider = "openai"，model 显式指定（不设则用 codex 默认）。
# - 鉴权：OPENAI_API_KEY 由 harness 注入 codex 子进程环境变量（不走 config，
#   减少泄露面）；有 env 时 codex 走 ApiKey 模式，无需 ChatGPT 登录界面。
# - approval_policy = "never" 仅为自动测试默认；生产可通过 T08/T09 面板调整。

model = "ark-code-latest"
model_provider = "volcengine-ark"
approval_policy = "never"

# 自定义 provider：本机内嵌 Ark 网关（127.0.0.1:18762）。
# 网关持有真实火山方舟 Ark API Key 与上游地址，做 wire_api 翻译：
# codex (Responses) ↔ 网关 ↔ 火山方舟 Ark (Chat Completions SSE)。
# wire_api 固定为 responses，codex 前端与 app-server 之间走新版协议。

[model_providers.volcengine-ark]
name = "火山方舟 Ark Code（内嵌网关）"
base_url = "http://127.0.0.1:18762/v1"
env_key = "VOLCENGINE_ARK_API_KEY"
wire_api = "responses"