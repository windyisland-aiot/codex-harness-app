[package]
name = "harness-app"
version = "0.8.6"
description = "Prism 桌面应用（Windows 目标）"
edition = "2021"

[lib]
name = "harness_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：会话内图片/视频预览（asset:// 协议）
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
regex = "1"
zip = "2"
harness-auth = { path = "../crates/auth" }
harness-appserver = { path = "../crates/appserver" }
harness-config = { path = "../crates/harness-config" }
harness-router = { path = "../crates/harness-router" }
harness-feishu-oauth = { path = "../crates/feishu-oauth" }
harness-plugins = { path = "../crates/harness-plugins" }
harness-search = { path = "../crates/harness-search" }
harness-sessions = { path = "../crates/harness-sessions" }
harness-rag = { path = "../crates/harness-rag" }
