[package]
name = "harness-app"
version = "0.1.0"
description = "企业内部 Agent 桌面应用（Windows 目标）"
edition = "2021"

[lib]
name = "harness_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harness-auth = { path = "../crates/auth" }
harness-appserver = { path = "../crates/appserver" }
harness-config = { path = "../crates/harness-config" }
harness-router = { path = "../crates/harness-router" }
harness-feishu-oauth = { path = "../crates/feishu-oauth" }
harness-plugins = { path = "../crates/harness-plugins" }
harness-search = { path = "../crates/harness-search" }