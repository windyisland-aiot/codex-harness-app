product:
  name: "比拜克胶囊"
  dosage_form: "胶囊剂"
  specification: "0.36g×9粒×2板"
  approval_number: "国药准字Z20026560"
  manufacturer: "四川金辉药业有限责任公司"
  otc: true
  dosage: "口服，一次2-3粒；小儿1-2粒；三岁以内酌减；一日三次。"
  ingredients:
    - "熊胆粉"
    - "酒大黄"
    - "儿茶"
    - "冰片"
    - "胡黄连"
    - "香墨"
    - "玄明粉"
  excipient: "淀粉"
  indications: "清热、解毒、通便；用于外感病气分热盛，发热烦躁，头痛目赤，牙龈肿痛，大便秘结。"
  confirmed_facts:
    bear_bile_powder_per_capsule: "每粒含量高达11.1mg熊胆粉"
    brand_heritage: "金辉药业出品，线下药店卖了二十多年的老产品"
    otc_label: "红标OTC"
    taste: "入口是厚重的苦味（熊胆粉、酒大黄、儿茶都苦），越苦下火越快，良药苦口利于病"
    herbal_formula: "七味清热祛火的中药精华"

script_policy:
  allowed_facts:
    - "name"
    - "ingredients"
    - "indications"
    - "dosage"
    - "otc"
    - "confirmed_facts.bear_bile_powder_per_capsule"
    - "manufacturer"
    - "confirmed_facts.brand_heritage"
    - "confirmed_facts.otc_label"
    - "confirmed_facts.taste"
    - "confirmed_facts.herbal_formula"
  approved_expressions:
    - "OTC"
    - "正规药品"
    - "正规中成药"
    - "国药准字（不写具体编号）"
  # 规格、批准文号、剂型仍在内部资料里，脚本需要时按语料习惯写。
  creative_context:
    - "上火"
  # 不设禁止表述：表达方式按语料放开，参考片段可直接照它的说法写。

