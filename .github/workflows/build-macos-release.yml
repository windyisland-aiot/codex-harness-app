name: T18 macOS 安装包构建 & GitHub Release

on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: t18-macos-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"
  # codex 官方便利二进制版本（与 Windows workflow 保持一致）
  CODEX_RELEASE: "rust-v0.150.1"

jobs:
  build-macos:
    name: 构建 macOS 安装包 (.dmg, Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              v="${GITHUB_REF#refs/tags/}"
            else
              v=$(git describe --tags --always --dirty=-snapshot)
            fi
          fi
          canon="${v#v}"
          echo "version_raw=$v" >> "$GITHUB_OUTPUT"
          echo "version=$canon" >> "$GITHUB_OUTPUT"
          echo "version_raw=$v  version=$canon"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust / cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 前端依赖 & 构建
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tail -40

      - name: 下载 codex macOS 二进制（aarch64，随包分发）
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/resources
          url="https://github.com/openai/codex/releases/download/${CODEX_RELEASE}/codex-aarch64-apple-darwin.tar.gz"
          curl -fL --retry 3 -o /tmp/codex-darwin.tar.gz "$url"
          # 包内为单文件 codex-aarch64-apple-darwin（已实测确认）
          tar -xzf /tmp/codex-darwin.tar.gz -C src-tauri/resources codex-aarch64-apple-darwin
          mv src-tauri/resources/codex-aarch64-apple-darwin src-tauri/resources/codex
          chmod +x src-tauri/resources/codex
          ls -la src-tauri/resources/codex
          # Apple Silicon 要求所有可执行文件至少 ad-hoc 签名，否则直接被杀
          codesign --force --sign - src-tauri/resources/codex || echo "codesign ad-hoc 失败（继续，可能仍可运行）"
          file src-tauri/resources/codex || true

      - name: 切换 tauri 配置为 macOS 资源映射 + bundle targets
        shell: bash
        run: |
          set -e
          # resources 映射从 codex.exe 换成 codex（Windows job 不受影响）
          sed -i '' 's#"resources/codex.exe": "codex.exe"#"resources/codex": "codex"#' src-tauri/tauri.conf.json
          grep -n "resources/codex" src-tauri/tauri.conf.json
          # bundle.targets 从 ["msi","nsis"] 改成 ["dmg"]，否则 macOS 上只编译二进制不打 dmg
          # 用 python 改 JSON，避免 sed 处理数组引号的坑
          python3 - <<'PY'
          import json, re
          p = "src-tauri/tauri.conf.json"
          with open(p) as f: s = f.read()
          data = json.loads(s)
          data["bundle"]["targets"] = ["dmg"]
          # 保持 2 空格缩进写回
          with open(p, "w") as f: json.dump(data, f, indent=2, ensure_ascii=False)
          f.write("\n")
          PY
          grep -n '"targets"' src-tauri/tauri.conf.json

      - name: 安装 tauri-cli
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"harness-root","private":true}' > package.json
          fi
          npm install -D @tauri-apps/cli@^2.0

      - name: 构建 Tauri 安装包（.app + .dmg，2 次重试）
        id: tauri_build
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2; do
            echo "==== tauri build attempt $i/2 ===="
            if npx tauri build 2>&1 | tee "tauri-build-attempt-$i.log" | tail -150; then
              echo "build_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $i failed"
            sleep 20
          done
          echo "build_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: 枚举产物
        id: artifacts
        shell: bash
        run: |
          set -e
          bundle=""
          for c in "$PWD/src-tauri/target/release/bundle" "$PWD/src-tauri/target/aarch64-apple-darwin/release/bundle" "$PWD/target/release/bundle"; do
            if [ -d "$c" ]; then bundle="$c"; break; fi
          done
          if [ -z "$bundle" ]; then
            echo "bundle dir missing"; ls -R src-tauri/target 2>/dev/null | head -40; exit 1
          fi
          echo "bundle dir: $bundle"
          find "$bundle/dmg" -name "*.dmg" -maxdepth 1 2>/dev/null || true
          dmg_count=$(find "$bundle/dmg" -name "*.dmg" -maxdepth 1 2>/dev/null | wc -l | tr -d ' ')
          if [ "$dmg_count" = "0" ]; then echo "no dmg built"; find "$bundle" -maxdepth 2 -type d; exit 1; fi
          echo "artifacts_path=$bundle/dmg" >> "$GITHUB_OUTPUT"

      - name: 上传 dmg 作为 workflow artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Prism-macOS-dmg-${{ steps.version.outputs.version }}
          path: ${{ steps.artifacts.outputs.artifacts_path }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release 并上传 dmg（tag push 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_raw }}
          name: Prism v${{ steps.version.outputs.version }} · macOS 安装包
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.artifacts_path }}/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
