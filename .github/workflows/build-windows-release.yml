name: T17 Windows 安装包构建 & GitHub Release

on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号（未填则取标签或 git describe）"
        required: false
        default: ""
      create_release:
        description: "是否创建 GitHub Release 并上传产物（tags push 时默认是，手动/分支默认否）"
        type: choice
        default: "auto"
        options: ["auto", "yes", "no"]
        required: false

concurrency:
  group: t17-windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  NODE_VERSION: "20"
  # codex 官方便利二进制版本（Windows x64）。
  # 下载到 src-tauri/resources/ 后随 Tauri resources 打进 MSI/NSIS，
  # 运行时 lib.rs 优先从 resourceDir/codex.exe 解析。
  CODEX_RELEASE: "rust-v0.150.1"

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包 (.msi / .exe-NSIS)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($v)) {
            if ($env:GITHUB_REF -like "refs/tags/*") {
              $v = ($env:GITHUB_REF -replace "^refs/tags/", "")
            } else {
              $v = (git describe --tags --always --dirty=-snapshot)
            }
          }
          $canon = $v -replace "^v", ""
          "version_raw=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$canon" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version_raw=$v  version=$canon"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 缓存 Rust / cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 前端依赖 & 构建
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build 2>&1 | Select-Object -Last 60

      - name: 下载 codex Windows 二进制（随包分发）
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "src-tauri\resources"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/openai/codex/releases/download/$env:CODEX_RELEASE/codex-x86_64-pc-windows-msvc.exe"
          $out = Join-Path $dir "codex.exe"
          Invoke-WebRequest -Uri $url -OutFile $out | Out-Null
          $sz = [math]::Round((Get-Item $out).Length / 1MB, 2)
          Write-Host "codex.exe 下载完成: $out ($sz MB)"
          # Windows 会因下载标记 Zone.Identifier 触发 Mark-of-the-Web；去掉，避免执行被拦截
          Unblock-File -Path $out -ErrorAction SilentlyContinue

      # ---------- 预缓存 NSIS（仅 NSIS；WiX 在 windows-latest 上已预装 candle.exe） ----------
      # 背景：tauri-cli 在 bundling 阶段会从 github.com/tauri-apps/binary-releases 拉 nsis-3.zip；
      # GitHub CDN 偶发 504 Gateway Timeout（run 33264434811 明确失败）。
      # 前置 6 次指数退避拉取，解压后通过 TAURI_NSIS_PATH 指向解压根目录，tauri-bundler 跳过 CDN。
      # WiX 不缓存：windows-latest runner 自带 WiX Toolset v3.14（C:\Program Files (x86)\WiX Toolset v3.14\bin）。
      - name: 预缓存 NSIS 打包工具（6 次退避 + TAURI_NSIS_PATH）
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $root = "D:\tauri-bundler-tools"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          function Download-WithRetry($url, $out) {
            $maxRetries = 6
            $delaySec = 5
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                # 显式 curl.exe 避免 PowerShell curl = Invoke-WebRequest 别名
                & curl.exe --proto '=https' --tlsv1.2 --location --fail `
                           --retry 3 --retry-connrefused --retry-delay $delaySec `
                           --connect-timeout 30 --max-time 300 `
                           -o "$out" "$url"
                if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $out)) {
                  $sz = [Math]::Round(((Get-Item $out).Length / 1MB), 2)
                  Write-Host "OK ($i/$maxRetries): $url -> $out ($sz MB)"
                  return $true
                }
              } catch {
                Write-Host "attempt $i/$maxRetries failed for $url : $_"
              }
              $wait = $delaySec * [Math]::Pow(2, ($i - 1))
              Write-Host "retry $i/$maxRetries wait ${wait}s ..."
              Start-Sleep -Seconds $wait
            }
            return $false
          }
          $nsisZip = Join-Path $root "nsis-3.zip"
          if (-not (Download-WithRetry "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3/nsis-3.zip" $nsisZip)) {
            Write-Error "NSIS 下载失败（已重试 6 次），tauri build 可能 CDN 504"; exit 1
          }
          # NSIS zip 顶层是 nsis-3/ 子目录；Expand-Archive 直接展开到 $root 就会形成 nsis-3/ 目录
          Expand-Archive -LiteralPath $nsisZip -DestinationPath $root -Force
          $nsisRoot = Join-Path $root "nsis-3"
          if (-not (Test-Path -LiteralPath $nsisRoot)) {
            Write-Error "NSIS 解压后未发现 $nsisRoot，目录结构异常："
            Get-ChildItem $root -Name
            exit 1
          }
          # TAURI_NSIS_PATH：tauri-bundler 2.x 会读取的变量，指向已解压 NSIS 根目录后，tauri 不再走 CDN
          "TAURI_NSIS_PATH=$nsisRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TAURI_NSIS_PATH=$nsisRoot"
          Write-Host "NSIS files:"
          Get-ChildItem $nsisRoot | Select-Object -First 8 Name

          # 同时打印 WiX 位置，确认 runner 自带 WiX 可用
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if ($candle) { Write-Host "WiX candle.exe: $candle（使用 runner 自带 WiX Toolset）" }
          else       { Write-Host "WiX candle.exe 不在 PATH，将使用 tauri 的 fallback 路径" }

      - name: 安装 tauri-cli
        shell: pwsh
        run: |
          if (-not (Test-Path package.json)) {
            '{"name":"harness-root","private":true}' | Out-File -FilePath package.json -Encoding utf8
          }
          $maxRetries = 4
          $delay = 5
          for ($i = 1; $i -le $maxRetries; $i++) {
            npm install -D @tauri-apps/cli@^2.0 2>&1 | Select-Object -Last 10
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "npm i tauri-cli attempt $i/$maxRetries failed, sleep ${delay}s ..."
            Start-Sleep -Seconds $delay
            $delay *= 2
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "安装 tauri-cli 多次重试失败"; exit 1 }

      - name: 检查 WiX（windows-latest 已预装）
        shell: pwsh
        run: |
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if ($candle) {
            Write-Host "WiX candle.exe: $candle"
          } else {
            Write-Host "WiX 未在 PATH 中（runner 可能版本变更），tauri-bundler 将 fallback 下载"
          }

      - name: 构建 Tauri 安装包（MSI + NSIS，3 次指数退避重试，抵抗偶发 CDN 504）
        shell: pwsh
        run: |
          # 不注入空 HTTP_PROXY/HTTPS_PROXY：空值会让 ureq 误走不存在的代理
          # 预缓存变量：TAURI_NSIS_PATH 已在上一步写入 GITHUB_ENV
          Write-Host "TAURI_NSIS_PATH = $env:TAURI_NSIS_PATH"
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if ($candle) { Write-Host "WiX candle.exe: $candle" }
          $maxRetries = 3
          $delaySec = 15
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "==== tauri build attempt $i/$maxRetries ===="
            & npx tauri build --verbose 2>&1 | Select-Object -Last 200
            if ($LASTEXITCODE -eq 0) {
              Write-Host "tauri build OK on attempt $i"
              exit 0
            }
            if ($i -lt $maxRetries) {
              $wait = $delaySec * [Math]::Pow(2, ($i - 1))
              Write-Host "tauri build attempt $i failed (exit=$LASTEXITCODE); wait ${wait}s before retry ..."
              Start-Sleep -Seconds $wait
            }
          }
          Write-Error "tauri build failed after $maxRetries attempts"
          exit 1

      - name: 枚举产物
        id: artifacts
        shell: pwsh
        run: |
          # Tauri bundler 可能把产物输出到 src-tauri/target/release/bundle 或 target/release/bundle，
          # 取决于 CARGO_TARGET_DIR / workspace 布局。这里动态探测两种位置。
          $candidates = @(
            "$PWD\src-tauri\target\release\bundle",
            "$PWD\target\release\bundle"
          )
          $bundle = $null
          foreach ($c in $candidates) {
            Write-Host "probe: $c -> $(Test-Path -LiteralPath $c)"
            if (Test-Path -LiteralPath $c) { $bundle = $c; break }
          }
          if (-not $bundle) {
            Write-Host "未在候选路径找到 bundle 目录，递归查找 target/release 下任何 bundle 目录："
            foreach ($t in @("$PWD\src-tauri\target\release", "$PWD\target\release")) {
              if (Test-Path -LiteralPath $t) {
                $found = Get-ChildItem -Recurse -Directory -LiteralPath $t -Filter 'bundle' -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { $bundle = $found.FullName; break }
              }
            }
          }
          if (-not $bundle) {
            Write-Host "仍找不到 bundle 目录，列出仓库根 target/* 与 src-tauri/target/* 以便排查："
            foreach ($t in @("$PWD\src-tauri\target", "$PWD\target")) {
              if (Test-Path -LiteralPath $t) {
                Write-Host "==== $t ===="
                Get-ChildItem -Recurse -Path $t -ErrorAction SilentlyContinue | Select-Object -First 30 FullName
              }
            }
            Write-Error "bundle dir missing in any candidate"; exit 1
          }
          Write-Host "bundle dir: $bundle"
          $all = Get-ChildItem -Recurse -File -LiteralPath $bundle | ForEach-Object { $_.FullName }
          $msi = @($all | Where-Object { $_ -match "\.msi$" })
          $exe = @($all | Where-Object { $_ -match "\.exe$" })
          Write-Host "MSI: $($msi -join ', ')"
          Write-Host "EXE: $($exe -join ', ')"
          if ($msi.Count -eq 0 -and $exe.Count -eq 0) { Write-Error "no installer built"; exit 1 }
          "artifact_count=$($msi.Count + $exe.Count)" >> $env:GITHUB_OUTPUT
          "artifacts_path=$bundle" >> $env:GITHUB_OUTPUT
          "artifacts_root=$PWD" >> $env:GITHUB_OUTPUT

      - name: 上传安装包作为 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harness-Installers-${{ steps.version.outputs.version }}
          path: ${{ steps.artifacts.outputs.artifacts_path }}
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: 决定是否创建 Release
        id: release_decision
        shell: pwsh
        run: |
          $mode = "${{ github.event.inputs.create_release }}"
          $tagPush = ($env:GITHUB_REF -like "refs/tags/*")
          if ($mode -eq "yes") { "do_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          elseif ($mode -eq "no") { "do_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          else {
            if ($tagPush) { "do_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
            else { "do_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          }

      - name: 创建 GitHub Release 并上传安装包
        if: steps.release_decision.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_raw }}
          name: Harness v${{ steps.version.outputs.version }} · Windows 安装包
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.artifacts_path }}/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 体积报告
        shell: pwsh
        run: |
          $bundle = "${{ steps.artifacts.outputs.artifacts_path }}"
          $all = Get-ChildItem -Recurse -File $bundle |
            Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}, FullName |
            Sort-Object SizeMB -Descending
          $all | Format-Table -AutoSize
          $csv = ($all | ConvertTo-Csv -NoTypeInformation) -join "`n"
          "## 体积报告" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "size_report<<EOF" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "`n$csv`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append